<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="SafeNest icon" href="./imagens/safenest2-removebg-preview.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <title>SafeNest - Entrar</title>
</head>
<body class="loginEcadastro-body">
    <main class="loginEcadastro-main">
        <div class="ladoImg">
            <div class="quadrado-azul-fundo"></div>
            <img class="comece-a-usar-imagem" src="./imagens/safenestLockAndNFCPicture.svg" alt="SafeNest Segurança">
        </div>
        <div class="ladoConteudo">
            <div class="header-form">
                <a href="index.html" class="voltar-link">← Voltar ao início</a>
                <h1 class="loginEcadastro-titulo">Entre na sua conta</h1>
                <h2 class="loginEcadastro-subtitulo">Bem-vindo de volta! Faça login e continue tendo sua residência protegida.</h2>
            </div>
            
            <form class="loginEcadastro-form">
                <div class="input-container">
                    <label class="loginEcadastro-label" for="email-login">Insira o seu e-mail</label>
                    <div class="input-wrapper">
                        <input id="email-login" class="loginEcadastro-input" type="email" placeholder="email123@email.com" required>
                        <svg class="loginEcadastro-icon-email" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="var(--azul-principal)"><path d="M160-160q-33 0-56.5-23.5T80-240v-480q0-33 23.5-56.5T160-800h640q33 0 56.5 23.5T880-720v480q0 33-23.5 56.5T800-160H160Zm320-280L160-600v360h640v-360L480-440Zm0-80 320-200H160l320 200ZM160-600v-120 480-360Z"/></svg>
                    </div>
                </div>

                <div class="input-container">
                    <label class="loginEcadastro-label" for="senha-login">Insira sua senha</label>
                    <div class="input-wrapper">
                        <input class="loginEcadastro-input" id="senha-login" type="password" placeholder="••••••••" required>
                        <img onclick="alterarVisibilidade('olho-login','senha-login')" id="olho-login" class="loginEcadastro-icon-senha" src="imagens/olhoFechado.svg" alt="Mostrar senha">
                    </div>
                </div>

                <div class="loginEcadastro-centralizar-botaoLoginEcadastro">
                    <button type="submit" class="loginEcadastro-botao">Fazer login</button>
                </div>
            </form>

            <p class="loginEcadastro-textinhoTroca">Ainda não tem uma conta? <span class="loginEcadastro-trocaPag" onclick="location.href='cadastrar.html'">Faça cadastro.</span></p>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
